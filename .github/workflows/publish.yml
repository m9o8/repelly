name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [default, min]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          environments: ${{ matrix.environment }}
      # Ubuntu blocks the user namespaces Chrome's sandbox needs for static export.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pixi run -e ${{ matrix.environment }} test-all

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          environments: default
      - run: pixi run -e default check-dist
      - name: Check the release tag matches the package version
        run: test -f "dist/repelly-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
