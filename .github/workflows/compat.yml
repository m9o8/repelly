name: Compatibility

# repelly relies on private Plotly internals, and pixi.lock hides new releases
# from the regular CI. This job runs the tests against the newest dependencies.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/compat.yml

permissions:
  contents: read

jobs:
  latest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          run-install: false
      # Ubuntu blocks the user namespaces Chrome's sandbox needs for static export.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pixi update --environment default
      - run: pixi list --environment default | grep -E "^(plotly|dash|kaleido|python) "
      - run: pixi run --environment default test-all
